services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MELI_API_DB_PATH: /data/meli_products.db
      MELI_API_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./meli_products.db:/data/meli_products.db:ro
    depends_on:
      redis:
        condition: service_healthy
